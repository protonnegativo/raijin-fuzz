name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: pip install tiktoken
      - name: Offline benchmark replay
        env:
          PY: python3
        run: |
          bench/run.sh "$RUNNER_TEMP/bench" | tee "$RUNNER_TEMP/bench.log"
          # every verify line must say 0 missing
          grep -q ' missing from output' "$RUNNER_TEMP/bench.log"
          ! grep -E '[1-9][0-9]* missing from output' "$RUNNER_TEMP/bench.log"
